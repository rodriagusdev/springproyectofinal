<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="#{controller.clientes.titulo}">Listado de Clientes</title>

  <!-- Bootstrap 5.3.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root {
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
      --bg-body: #f8fafc;
    }

    body {
      background-color: var(--bg-body);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Navbar moderna oscura */
    .navbar-custom {
      background: #1e293b !important;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    /* Tarjetas */
    .card {
      border: none;
      border-radius: 12px;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
    }

    .card-header {
      background-color: #ffffff;
      border-bottom: 1px solid #f1f5f9;
      border-top-left-radius: 12px !important;
      border-top-right-radius: 12px !important;
      padding: 1.25rem;
    }

    /* Tabla elegante */
    .table thead th {
      background-color: #f8fafc !important;
      color: #475569;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      border-bottom: 2px solid #e2e8f0;
      padding: 1rem 0.75rem;
    }

    .table td {
      padding: 1rem 0.75rem;
      color: #334155;
    }

    /* Botones de acción personalizados */
    .btn-primary-custom {
      background-color: var(--primary-color);
      color: white;
      border-radius: 8px;
      font-weight: 500;
      transition: all 0.2s ease-in-out;
    }
    .btn-primary-custom:hover {
      background-color: var(--primary-hover);
      color: white;
      transform: translateY(-1px);
    }

    .btn-icon {
      width: 34px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      transition: background-color 0.2s;
    }

    /* Paginación estilo moderno */
    .pagination .page-link {
      color: var(--primary-color);
      border: none;
      margin: 0 3px;
      border-radius: 8px;
      font-weight: 500;
    }
    .pagination .page-link:hover {
      background-color: #e0e7ff;
      color: var(--primary-hover);
    }
    .pagination .page-item.active .page-link {
      background-color: var(--primary-color);
      color: #fff;
    }
    .pagination .page-item.disabled .page-link {
      color: #94a3b8;
      background-color: transparent;
    }

    /* Alertas con estilo flotante moderno */
    .alert {
      border: none;
      border-radius: 10px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
  </style>
</head>
<body>

<div class="container py-4">

  <!-- Alertas -->
  <div th:if="${success}" class="alert alert-success alert-dismissible fade show mb-4" role="alert">
    <i class="bi bi-check-circle-fill me-2"></i>
    <span th:text="${success}">Operación exitosa</span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>

  <div th:if="${warning}" class="alert alert-warning alert-dismissible fade show mb-4" role="alert">
    <i class="bi bi-exclamation-triangle-fill me-2"></i>
    <span th:text="${warning}">Advertencia</span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>

  <!-- NAVBAR / HEADER MODERNO -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom px-4 mb-4">
    <div class="container-fluid px-0">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="#">
        <i class="bi bi-grid-1x2-fill" style="color: #818cf8;"></i>
        <span th:text="#{controller.clientes.titulo}">Panel de Clientes</span>
      </a>

      <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse"
              data-bs-target="#navbarContent" aria-controls="navbarContent"
              aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      
      <div class="collapse navbar-collapse" id="navbarContent">
        <div class="ms-auto d-flex align-items-center gap-2 mt-3 mt-lg-0">
          <a class="btn btn-outline-light btn-sm px-3 rounded-pill"
             th:href="@{'/listar'(format=xlsx)}" data-bs-toggle="tooltip" data-bs-title="Exportar Excel">
            <i class="bi bi-file-earmark-excel me-1 text-success"></i> XLSX
          </a>
          <a class="btn btn-outline-light btn-sm px-3 rounded-pill"
             th:href="@{'/listar'(format=pdf)}" data-bs-toggle="tooltip" data-bs-title="Exportar PDF">
            <i class="bi bi-file-earmark-pdf me-1 text-danger"></i> PDF
          </a>

          <!-- Idiomas -->
          <div class="vr mx-2 bg-secondary d-none d-lg-block"></div>
          <a class="btn btn-dark btn-sm border-secondary text-light px-2" th:href="@{/locale(lang=es_ES)}">ES</a>
          <a class="btn btn-dark btn-sm border-secondary text-light px-2" th:href="@{/locale(lang=en_EN)}">EN</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- CONTENIDO PRINCIPAL -->
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-2">
        <div class="p-2 rounded-3 d-flex align-items-center justify-content-center" style="background-color: #e0e7ff; color: #4f46e5; width: 36px; height: 36px;">
          <i class="bi bi-people-fill"></i>
        </div>
        <span th:text="#{controller.clientes.listado}" class="fw-bold text-dark m-0 fs-5">Listado de registros</span>
      </div>
      
      <a class="btn btn-primary-custom btn-sm px-3 py-2 d-flex align-items-center gap-1" th:text="#{controller.clientes.crear}"
         th:href="@{/form}">
        <i class="bi bi-plus-lg"></i>
        <span>Crear cliente</span>
      </a>
    </div>

    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr>
              <th class="ps-4"># ID</th>
              <th th:text="#{controller.clientes.nombreUsuario}">Usuario</th>
              <th th:text="#{controller.clientes.nombre}">Nombre</th>
              <th th:text="#{controller.clientes.apellido}">Apellido</th>
              <th th:text="#{controller.clientes.correo}">Email</th>
              <th th:text="#{controller.clientes.fecha}">Fecha de Registro</th>
              <th th:text="#{controller.clientes.borrar}" class="text-center">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="cliente : ${lista}">
              <td class="ps-4 fw-semibold">
                <a th:href="@{/ver/{id}(id=${cliente.id})}"
                   class="text-decoration-none text-dark hover-primary"
                   th:text="${'#' + cliente.id}">#1</a>
              </td>
              <td>
                <span class="badge bg-indigo-subtle text-indigo px-2 py-1" style="background-color: #e0e7ff; color: #4f46e5;" th:text="${cliente.nombreUsuario}">username</span>
              </td>
              <td>
                <span class="fw-medium text-dark" th:text="${cliente.nombre}">Nombre</span>
              </td>
              <td th:text="${cliente.apellido}">Apellido</td>
              <td>
                <span class="text-muted" th:text="${cliente.email}">email@dominio.com</span>
              </td>
              <td>
                <span class="badge bg-light text-secondary border px-2 py-1" th:text="${cliente.createAt}">2025-01-01</span>
              </td>

              <!-- Eliminar -->
              <td class="text-center">
                <a th:href="@{/eliminar/{id}(id=${cliente.id})}"
                   class="btn btn-light btn-icon text-danger border-0"
                   data-bs-toggle="tooltip" data-bs-title="Eliminar cliente"
                   aria-label="Eliminar">
                  <i class="bi bi-trash3"></i>
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Paginación -->
      <div class="card-footer bg-white border-0 py-3">
        <nav aria-label="Paginación">
          <ul class="pagination justify-content-center mb-0">
            <!-- Anterior -->
            <li class="page-item" th:classappend="${pagina.first} ? 'disabled'">
              <a class="page-link"
                 th:href="@{/listar(page=${pagina.number - 1}, size=${pagina.size}, sort=${sort}, dir=${dir})}"
                 aria-label="Anterior">
                <span aria-hidden="true"><i class="bi bi-chevron-left"></i></span>
              </a>
            </li>
            <!-- Números -->
            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, pagina.totalPages - 1)}"
                th:classappend="${i} == ${pagina.number} ? 'active'">
              <a class="page-link"
                 th:text="${i + 1}"
                 th:href="@{/listar(page=${i}, size=${pagina.size}, sort=${sort}, dir=${dir})}">
              </a>
            </li>
            <!-- Siguiente -->
            <li class="page-item" th:classappend="${pagina.last} ? 'disabled'">
              <a class="page-link"
                 th:href="@{/listar(page=${pagina.number + 1}, size=${pagina.size}, sort=${sort}, dir=${dir})}"
                 aria-label="Siguiente">
                <span aria-hidden="true"><i class="bi bi-chevron-right"></i></span>
              </a>
            </li>
          </ul>
        </nav>
      </div>

    </div>
  </div>

</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

<script>
  // Tooltips
  document.addEventListener('DOMContentLoaded', function () {
    const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
    [...tooltipTriggerList].forEach(el => new bootstrap.Tooltip(el));
  });
</script>
</body>
</html>
